<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ринкова аналітика</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f3f2ef);
    --text: var(--tg-theme-text-color, #0b0b0b);
    --muted: var(--tg-theme-hint-color, #6b6a66);
    --accent: var(--tg-theme-button-color, #2a78d6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(120,120,120,.22);
    --s-price: #2a78d6;
    --s-forecast: #eb6834;
    --s-sma: #1baf7a;
    --up: #0a7d4f;
    --down: #c4372f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg-light]) {
      color-scheme: dark;
      --bg: var(--tg-theme-bg-color, #17171a);
      --card: var(--tg-theme-secondary-bg-color, #232327);
      --text: var(--tg-theme-text-color, #f0efec);
      --muted: var(--tg-theme-hint-color, #a3a29a);
      --s-price: #3987e5;
      --s-forecast: #d95926;
      --s-sma: #199e70;
      --up: #4cc38a;
      --down: #f07a72;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; min-height: 40px; }
  .chip[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .head { margin: 18px 0 4px; }
  .name { color: var(--muted); font-size: 14px; }
  .price { font-size: 34px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .price small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .changes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .delta { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--card);
    font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }
  .asof { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-top: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; min-height: 32px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .legend i.dash { border-top-style: dashed; }

  #chartWrap { position: relative; touch-action: pan-y; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round; }
  #tip { position: absolute; pointer-events: none; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; line-height: 1.4;
    box-shadow: 0 4px 14px rgba(0,0,0,.15); white-space: nowrap; display: none; z-index: 2; font-variant-numeric: tabular-nums; }
  #tip b { display: block; margin-bottom: 2px; }

  .forecast-note { font-size: 13px; margin-top: 8px; }
  .forecast-note .m { color: var(--muted); }

  .rsi-bar { position: relative; height: 10px; border-radius: 999px; margin: 14px 0 6px;
    background: linear-gradient(to right, var(--s-sma) 0 30%, var(--line) 30% 70%, var(--down) 70% 100%); opacity: .9; }
  .rsi-dot { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--text);
    border: 3px solid var(--bg); transform: translate(-50%, -50%); }
  .rsi-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .rsi-val { font-size: 22px; font-weight: 700; }
  .rsi-val span { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  tr.best td:first-child { font-weight: 700; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
    background: var(--accent); color: var(--accent-text); margin-left: 6px; vertical-align: middle; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .disclaimer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  .state { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
<main>
  <div class="chips" role="tablist" aria-label="Актив" id="chips"></div>
  <div id="view"><div class="state">Завантаження…</div></div>
  <p class="disclaimer" id="disclaimer">Навчальна розробка, а не фінансова порада.</p>
</main>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  if (tg.colorScheme === 'light') document.documentElement.setAttribute('data-tg-light', '');
}
const $ = (id) => document.getElementById(id);
const state = { tickers: [], current: null, data: null, range: 30 };
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(v, kind) {
  if (v === null || v === undefined) return '—';
  const digits = kind === 'crypto' ? (Math.abs(v) >= 1000 ? 0 : 2) : 4;
  return Number(v).toLocaleString('uk-UA', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
const dm = (iso) => iso.slice(8, 10) + '.' + iso.slice(5, 7);

function deltaChip(label, pct) {
  if (pct === null || pct === undefined) return '';
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '•';
  const sign = pct > 0 ? '+' : '';
  return `<span class="delta ${cls}">${arrow} ${sign}${pct.toFixed(2).replace('.', ',')}% <span style="font-weight:400;color:var(--muted)">${label}</span></span>`;
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
  return r.json();
}

async function init() {
  try {
    state.tickers = await api('/api/tickers');
    $('chips').innerHTML = state.tickers.map(t =>
      `<button class="chip" role="tab" data-t="${t.ticker}" aria-selected="false">${t.ticker}</button>`).join('');
    $('chips').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      select(b.dataset.t);
    });
    select(state.tickers[0].ticker);
  } catch (e) {
    $('view').innerHTML = `<div class="state">Не вдалося завантажити дані.<br>${esc(e.message)}</div>`;
  }
}

async function select(ticker) {
  state.current = ticker;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-selected', c.dataset.t === ticker));
  $('view').innerHTML = '<div class="state">Завантаження…</div>';
  try {
    const d = await api('/api/analysis/' + ticker);
    if (state.current !== ticker) return;   // користувач уже обрав інший актив
    state.data = d;
    render();
  } catch (e) {
    $('view').innerHTML = `<div class="state">Даних по ${ticker} ще немає.<br>Запустіть збір даних (run.py або main.py).</div>`;
  }
}

function render() {
  const d = state.data, k = d.kind;
  const f = d.forecast;
  const fNote = f ? `<div class="forecast-note">Прогноз на завтра: <b>${fmt(f.values[0], k)}</b>,
      через ${f.values.length} днів: <b>${fmt(f.values[f.values.length - 1], k)}</b>
      <div class="m">Метод: ${esc(f.method)} (найменша похибка в перевірці)</div></div>` : '';

  const rows = d.metrics.map(m => `<tr class="${m.method === d.best_method ? 'best' : ''}">
      <td>${esc(m.method)}${m.method === d.best_method ? '<span class="badge">найкращий</span>' : ''}</td>
      <td>${m['MAPE_%'].toFixed(2).replace('.', ',')}</td>
      <td>${fmt(m.MAE, k)}</td>
      <td>${m['accuracy_%'].toFixed(0)}</td></tr>`).join('');

  $('view').innerHTML = `
    <div class="head">
      <div class="name">${esc(d.name)}</div>
      <div class="price">${fmt(d.last_price, k)}<small>${esc(d.currency_label)}</small></div>
      <div class="changes">${deltaChip('за добу', d.change_1d_pct)}${deltaChip('за 7 днів', d.change_7d_pct)}</div>
      <div class="asof">Останнє значення: ${dm(d.last_date)}.${d.last_date.slice(0, 4)}${k === 'currency' ? ' · офіційний курс НБУ, оновлюється раз на добу' : ''}</div>
    </div>

    <section class="card">
      <div class="row"><h2>Динаміка та прогноз</h2>
        <div class="seg" id="seg">
          <button data-r="30" aria-pressed="${state.range === 30}">30 днів</button>
          <button data-r="60" aria-pressed="${state.range === 60}">Усе</button>
        </div>
      </div>
      <div class="legend">
        <span><i style="border-color:var(--s-price)"></i>Курс</span>
        <span><i style="border-color:var(--s-sma)"></i>Середнє за 7 днів</span>
        ${f ? '<span><i class="dash" style="border-color:var(--s-forecast)"></i>Прогноз</span>' : ''}
      </div>
      <div id="chartWrap"><svg id="chart" role="img" aria-label="Графік курсу ${esc(d.ticker)}"></svg><div id="tip"></div></div>
      ${fNote}
    </section>

    <section class="card">
      <h2>RSI (14 днів)</h2>
      <div class="rsi-val">${d.rsi.toFixed(1).replace('.', ',')}<span>${esc(d.rsi_label)}</span></div>
      <div class="rsi-bar"><div class="rsi-dot" style="left:${Math.min(100, Math.max(0, d.rsi))}%"></div></div>
      <div class="rsi-scale"><span>0 · перепроданість &lt; 30</span><span>&gt; 70 · перекупленість · 100</span></div>
    </section>

    <section class="card">
      <h2>Порівняння методів прогнозу</h2>
      ${d.metrics.length ? `<table>
        <thead><tr><th>Метод</th><th>MAPE, %</th><th>MAE</th><th>Напрямок, %</th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="hint">Перевірка на ${d.metrics[0].n_forecasts} прогнозах «на добу вперед» (метод ковзного вікна). Менше MAPE — точніше.</div>` : '<div class="hint">Замало даних для порівняння.</div>'}
    </section>`;
  $('disclaimer').textContent = d.disclaimer;

  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.range = Number(b.dataset.r);
    document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    drawChart();
  });
  drawChart();
}

/* ---------- Графік: чистий SVG без залежностей ---------- */
function drawChart() {
  const d = state.data, k = d.kind, svg = $('chart');
  const W = $('chartWrap').clientWidth || 320, H = 240;
  const m = { l: 8, r: 8, t: 18, b: 24 };
  const n = Math.min(state.range, d.history.prices.length);
  const dates = d.history.dates.slice(-n), prices = d.history.prices.slice(-n), sma = d.history.sma7.slice(-n);
  const f = d.forecast;
  const allDates = dates.concat(f ? f.dates : []);
  const total = allDates.length;

  const ys = prices.concat(sma.filter(v => v !== null), f ? f.values : []);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo || hi * 0.01) * 0.1; lo -= pad; hi += pad;

  const x = i => m.l + (W - m.l - m.r) * (total === 1 ? 0 : i / (total - 1));
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const path = (arr, off) => arr.map((v, i) => v === null ? null : [x(i + off), y(v)])
      .filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  let g = '';
  for (let i = 0; i <= 3; i++) {                       // горизонтальна сітка + підписи осі Y
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${m.l}" y="${yy - 4}">${fmt(v, k)}</text>`;
  }
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {                    // підписи дат
    const idx = Math.round((total - 1) * i / ticks);
    const anchor = i === 0 ? 'start' : i === ticks ? 'end' : 'middle';
    g += `<text x="${x(idx)}" y="${H - 6}" text-anchor="${anchor}">${dm(allDates[idx])}</text>`;
  }
  if (f) {                                              // межа «факт | прогноз»
    const xf = x(n - 1);
    g += `<line x1="${xf}" x2="${xf}" y1="${m.t}" y2="${H - m.b}" stroke="var(--line)" stroke-dasharray="3 4"/>`;
  }
  g += `<path d="${path(sma, 0)}" fill="none" stroke="var(--s-sma)" stroke-width="1.5" stroke-linejoin="round"/>`;
  g += `<path d="${path(prices, 0)}" fill="none" stroke="var(--s-price)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (f) {
    const fp = [prices[n - 1]].concat(f.values);        // прогноз виходить з останньої точки факту
    g += `<path d="${path(fp, n - 1)}" fill="none" stroke="var(--s-forecast)" stroke-width="2.25" stroke-dasharray="6 5" stroke-linecap="round"/>`;
  }
  g += `<g id="hover" style="display:none"><line id="hl" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1"/>
        <circle id="hd" r="5" fill="var(--s-price)" stroke="var(--card)" stroke-width="2"/></g>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = g;

  const tip = $('tip'), hover = svg.querySelector('#hover');
  function show(clientX) {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(total - 1, Math.round((clientX - r.left - m.l) / (W - m.l - m.r) * (total - 1))));
    const isF = i >= n;
    const val = isF ? f.values[i - n] : prices[i];
    hover.style.display = '';
    svg.querySelector('#hl').setAttribute('x1', x(i)); svg.querySelector('#hl').setAttribute('x2', x(i));
    const dot = svg.querySelector('#hd');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(val));
    dot.setAttribute('fill', isF ? 'var(--s-forecast)' : 'var(--s-price)');
    let html = `<b>${dm(allDates[i])}.${allDates[i].slice(0, 4)}</b>${isF ? 'Прогноз' : 'Курс'}: ${fmt(val, k)} ${esc(d.currency_label)}`;
    if (!isF && sma[i] !== null) html += `<br>Середнє 7 днів: ${fmt(sma[i], k)}`;
    tip.innerHTML = html; tip.style.display = 'block';
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, x(i) - tw / 2)) + 'px';
    tip.style.top = '0px';
  }
  svg.onpointermove = e => show(e.clientX);
  svg.onpointerdown = e => show(e.clientX);
  svg.onpointerleave = () => { tip.style.display = 'none'; hover.style.display = 'none'; };
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => state.data && drawChart(), 120); });

init();
</script>
</body>
</html>
